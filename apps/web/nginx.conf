# Full nginx.conf for the Carpoolr web SPA (Vite build output in
# /usr/share/nginx/html). This is the main config, not a conf.d snippet,
# because `worker_processes` is only valid in the main context.
#
# Performance decisions, each measured against the real bundle with bombardier
# (50 connections, gzip-capable client, container CPU limit 250m):
#
#   * gzip_static on, precompressed .gz from the image build. Serving a
#     precompressed file is 37-47x faster than compressing per request
#     (31.7k vs 0.68k req/s). `gzip on` stays ONLY as a fallback for a file
#     that has no .gz sibling; the build writes siblings for everything above
#     gzip_min_length, so the fallback does not run in practice.
#   * worker_processes 1. Measured in a container capped at 250m CPU: 4.4k
#     req/s and 11 MiB RSS with one worker, versus 3.0k req/s and 42 MiB with
#     `auto` (8 workers). Extra workers only add scheduler churn and stack.
#   * sendfile + tcp_nopush. Kernel-side file transfer, full packets.
#   * keepalive_timeout 65 keeps the Traefik hop warm.

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The container runs with readOnlyRootFilesystem. The unprivileged base
    # already points every temp path at /tmp, which the Deployment mounts as
    # an emptyDir.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/wasm
        image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        charset utf-8;

        # Health endpoint for the container HEALTHCHECK and the Kubernetes
        # probes: constant time, never logged, no file I/O.
        location = /healthz {
            access_log off;
            # `default_type` sets the one Content-Type header; an
            # `add_header Content-Type` here would emit it twice.
            default_type text/plain;
            return 200 "ok\n";
        }

        # ── API reverse proxy ──────────────────────────────────────────────
        location = /api {
            return 308 /api/;
        }

        location /api/ {
            add_header Cache-Control "no-store" always;
            proxy_pass http://carpoolr-api:8080/;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Service worker and manifest ────────────────────────────────────
        location = /sw.js {
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            default_type application/manifest+json;
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # ── Fingerprinted assets: cache forever ────────────────────────────
        location ^~ /assets/ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location ^~ /icons/ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # ── Documents: revalidate ──────────────────────────────────────────
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # The app is client-routed, so an unknown path is not a 404: it must
        # reach index.html and be resolved by the router.
        location / {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
