apiVersion: apps/v1
kind: Deployment
metadata:
  name: carpoolr-web
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carpoolr-web
  template:
    metadata:
      labels:
        app: carpoolr-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: web
          image: ghcr.io/meems-labs/carpoolr-web:fa6d7ac
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
