apiVersion: apps/v1
kind: Deployment
metadata:
  name: carpoolr-api
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carpoolr-api
  template:
    metadata:
      labels:
        app: carpoolr-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api
          image: ghcr.io/meems-labs/carpoolr-api:fa6d7ac
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
