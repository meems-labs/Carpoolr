apiVersion: apps/v1
kind: Deployment
metadata:
  name: carpoolr-api
  namespace: staging
spec:
  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: Always
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Staging
            - name: DemoMode__Enabled
              value: "true"
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  # v2 zeigt auf postgres-staging. `carpoolr-database`
                  # (alte eigene Instanz) bleibt als Rollback im Cluster,
                  # bis die Migration verifiziert ist.
                  name: carpoolr-database-v2
                  key: ConnectionStrings__Default
