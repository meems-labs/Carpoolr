apiVersion: apps/v1
kind: Deployment
metadata:
  name: carpoolr-api
  namespace: staging
spec:
  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: Always
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Staging
            - name: DemoMode__Enabled
              value: "true"
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: carpoolr-database
                  key: ConnectionStrings__Default
