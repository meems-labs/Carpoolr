apiVersion: v1
kind: Service
metadata:
  name: carpoolr-db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  type: ClusterIP
  selector:
    app: carpoolr-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: carpoolr-db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: carpoolr-db
  replicas: 1
  selector:
    matchLabels:
      app: carpoolr-db
  template:
    metadata:
      labels:
        app: carpoolr-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: carpoolr
            - name: POSTGRES_USER
              value: carpoolr
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carpoolr-database
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # 500m war zu eng: gemessen am 2026-11-25 wurden 454.571 von
          # 1.741.677 CPU-Perioden gedrosselt (26 %, ~5,9 h kumuliert).
          # Bei einer Drosselungsspitze reisst die 1-Sekunden-Probe das
          # Zeitbudget und Kubernetes killt Postgres mitten in der Arbeit.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # timeoutSeconds fehlte = Default 1 s. `pg_isready` startet
          # einen Prozess und verbindet sich; gemessen 112-277 ms im
          # Leerlauf, unter Drosselung deutlich mehr. 57 Restarts in
          # 16 Tagen waren die Folge ("command timed out ... after 1s").
          startupProbe:
            exec:
              command: [pg_isready, -U, carpoolr, -d, carpoolr]
            periodSeconds: 5
            failureThreshold: 60
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: [pg_isready, -U, carpoolr, -d, carpoolr]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, carpoolr, -d, carpoolr]
            periodSeconds: 10
            timeoutSeconds: 5
            # 5 statt 3: ein einzelner Aussetzer soll nicht neu starten.
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: postgres-run
              mountPath: /var/run/postgresql
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: postgres-run
          emptyDir: {}
        - name: temporary
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
