apiVersion: v1
kind: Service
metadata:
  name: carpoolr-db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  type: ClusterIP
  selector:
    app: carpoolr-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: carpoolr-db
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: carpoolr-db
  replicas: 1
  selector:
    matchLabels:
      app: carpoolr-db
  template:
    metadata:
      labels:
        app: carpoolr-db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: carpoolr
            - name: POSTGRES_USER
              value: carpoolr
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: carpoolr-database
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            exec:
              command: [pg_isready, -U, carpoolr, -d, carpoolr]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [pg_isready, -U, carpoolr, -d, carpoolr]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, carpoolr, -d, carpoolr]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: postgres-run
              mountPath: /var/run/postgresql
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: postgres-run
          emptyDir: {}
        - name: temporary
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
