apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carpoolr
  namespace: staging
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: carpoolr.staging.splashmich.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: carpoolr-web
                port:
                  number: 80

