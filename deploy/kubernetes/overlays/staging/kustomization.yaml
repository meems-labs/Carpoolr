apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base
  - ingress.yaml
  # postgres.yaml NICHT mehr: die eigene carpoolr-db entfaellt. Die
  # Staging-Daten liegen in der geteilten Instanz `postgres-staging`
  # (Namespace database-staging), die getunt ist und ein Backup hat.
  #
  # Reihenfolge: die Instanz selbst wird von k3s-infra verwaltet
  # (Application postgres-staging), nicht von hier.
  - database-bootstrap.yaml
  - database-migrate.yaml

patches:
  - path: api-demo.patch.yaml

images:
  - name: ghcr.io/meems-labs/carpoolr-api
    newTag: 38d62649c83e6bcbb76d39e6e0917c1e212b8b83
  - name: ghcr.io/meems-labs/carpoolr-web
    newTag: 38d62649c83e6bcbb76d39e6e0917c1e212b8b83
